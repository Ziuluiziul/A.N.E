<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <!-- Ícone do Atlas Neural-Epistêmico. As cores são as da paleta OKLCH do projeto
       (ADR-001): fundo profundo, arestas inativas e seis dos doze tokens de domínio.
       Um grafo sobre uma calota, que é literalmente como o Atlas dispõe os MOCs. -->
  <defs>
    <radialGradient id="fundo" cx="38%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#21272f"/>
      <stop offset="70%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#070a0e"/>
    </radialGradient>
    <linearGradient id="calota" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9be4fc" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#9be4fc" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="128" height="128" rx="28" fill="url(#fundo)"/>

  <!-- A calota onde os MOCs se distribuem -->
  <ellipse cx="64" cy="64" rx="44" ry="44" fill="none" stroke="#9be4fc" stroke-opacity="0.22" stroke-width="1.5"/>
  <ellipse cx="64" cy="64" rx="44" ry="17" fill="none" stroke="#6f7c89" stroke-opacity="0.45" stroke-width="1.5"/>
  <path d="M20 64a44 44 0 0 1 88 0" fill="url(#calota)" stroke="none"/>
  <ellipse cx="64" cy="64" rx="17" ry="44" fill="none" stroke="#6f7c89" stroke-opacity="0.30" stroke-width="1.5"/>

  <!-- Arestas tipadas: sólidas onde há relação, ténues onde é só navegação -->
  <g stroke="#bcc5d1" stroke-opacity="0.55" stroke-width="2" stroke-linecap="round" fill="none">
    <path d="M64 40 L38 58"/>
    <path d="M64 40 L90 58"/>
    <path d="M38 58 L52 92"/>
    <path d="M90 58 L78 92"/>
    <path d="M52 92 L78 92"/>
  </g>
  <g stroke="#6f7c89" stroke-opacity="0.40" stroke-width="1.5" stroke-dasharray="3 4" fill="none">
    <path d="M38 58 L90 58"/>
    <path d="M64 40 L64 92" stroke-opacity="0.25"/>
  </g>

  <!-- Nós: o central é o MOC raiz, os demais são domínios -->
  <circle cx="64" cy="40" r="9" fill="#7fd4ff"/>
  <circle cx="64" cy="40" r="9" fill="none" stroke="#edf2f9" stroke-opacity="0.85" stroke-width="2"/>
  <circle cx="38" cy="58" r="6.5" fill="#ff9d8f"/>
  <circle cx="90" cy="58" r="6.5" fill="#8fe0b4"/>
  <circle cx="52" cy="92" r="6" fill="#e8c46a"/>
  <circle cx="78" cy="92" r="6" fill="#c2a3ff"/>
  <circle cx="64" cy="64" r="4.5" fill="#ff9ecb"/>
</svg>
