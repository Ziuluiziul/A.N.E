[project]
name = "ane"
version = "0.1.0"
description = "A.N.E. (Atlas Neural-Epistêmico): corpus acadêmico vivo e o sistema que o projeta, delibera e promove"
requires-python = ">=3.13"
dependencies = [
    # Backend
    "fastapi>=0.121",
    "uvicorn[standard]>=0.40",
    "pydantic>=2.13",
    "pydantic-settings>=2.13",
    "httpx>=0.28",
    "aiosqlite>=0.21",
    "networkx>=3.5",
    "markdown-it-py>=4.0",
    "pyyaml>=6.0",
    "watchfiles>=1.1",
    "tenacity>=9.1",
    "orjson>=3.11",
    # Provedores
    "google-genai>=1.50",
    "groq>=0.35",
    "openai>=2.14",          # cliente compatível, usado só para o NVIDIA NIM
    # Google Workspace
    "google-api-python-client>=2.190",
    "google-auth>=2.42",
    "google-auth-oauthlib>=1.2",
    "google-auth-httplib2>=0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.3",
    "ruff>=0.15",
    "mypy>=1.19",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Três raízes de código, cada uma com o papel que o nome anuncia. O corpus em
# knowledge/ não é código e não entra no pacote.
[tool.hatch.build.targets.wheel]
packages = ["backend/src/vault", "providers", "integrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 96
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

# As três raízes de código do projeto. Sem isso o isort as trata como terceiros.
[tool.ruff.lint.isort]
known-first-party = ["vault", "providers", "integrations"]

[tool.mypy]
python_version = "3.13"
files = ["backend/src", "providers", "integrations", "tools", "tests"]
ignore_missing_imports = true
